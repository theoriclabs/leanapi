name = "leanapi"
version = "0.1.0"
defaultTargets = ["LeanApi", "PolicyView", "Helpdesk", "Billing", "Scheduling", "TeamsDemo"]

# Crypto dependency (M2), pinned by tag.
[[require]]
name = "leancrypto"
git = "https://github.com/theoriclabs/leancrypto"
rev = "v0.1.0"

# Toolchain: leanprover/lean4:v4.33.0, the toolchain of LeanDB, leanontology and
# LeanReact. Path dependencies share one build, so the whole stack must use one
# toolchain. (The nightly-2026-09-26 pin for lean4#15174, which stops `Std.Http`
# from parking a thread on every socket read, returns with v4.36.0 for every repo.)

# Persistence and the portable data model (`LeanDb.Model`, `LeanDb.Native`).
# Path dependencies on the sibling checkouts during development; a pinned git
# require for fresh clones is DDD-LAPI-04.
[[require]]
name = "leandb"
path = "../LeanDB"

# Wire codecs and checked value types (`Ontology`).
[[require]]
name = "leanontology"
path = "../leanontology"

[[lean_lib]]
name = "LeanApi"
roots = ["LeanApi", "LeanApi.Core", "LeanApi.Native"]

# The portable contract layer (no sockets, SQLite or native code; LeanJS-compilable):
# operation contracts and codecs, transports, the HTTP envelope, call failures, channels,
# and browser client generation (`LeanContract.Generate`, with its JS runtime next to it).
[[lean_lib]]
name = "LeanContract"
globs = ["LeanContract", "LeanContract.+"]

# `LeanApi.Core`, the portable operation layer: `Op`/`ReadOp`, `require`, `Clock`, auth,
# `derive_operation`, `Api`/`post`/`get`, the in-memory runner, and the application
# assembly it publishes into (`LeanApi.Publication`). Its import closure is this library,
# `LeanContract`, `LeanDb.Model`, `LeanOntology` and Lean (`scripts/CoreClosure.lean`).
[[lean_lib]]
name = "LeanApiCore"
roots = ["LeanApi.Core"]

# `LeanApi.Core` tests, checked when the modules compile (`#guard`, `#guard_msgs`) and run in
# memory by `leanapi_core_tests`: the post's operations and endpoints, loans, auth, the
# envelope and the contracts.
[[lean_lib]]
name = "TestsCore"
globs = ["TestsCore.+"]

[[lean_exe]]
name = "leanapi_core_tests"
root = "TestsCore"

# Native fixtures and checks (`TestsNative/`): apps served over HTTP and SQLite by the
# acceptance scripts under `scripts/`, and in-process checks of the native layer.
[[lean_lib]]
name = "TestsNative"
globs = ["TestsNative.+"]

# The native layer's in-process checks (contract, prepared, KDF gate, native reads and
# commands, routes and sessions, the post's api); `routes --serve` and `post serve` serve apps.
[[lean_exe]]
name = "leanapi_native_checks"
root = "TestsNative.Checks"

# Fixture apps served by the acceptance scripts: the library (generality), the migration gate,
# and the post's app before `guestList`.
[[lean_exe]]
name = "leanapi_apps"
root = "TestsNative.Apps"

# An app with no accounts at the root namespace (public counters) and a represented field
# (reservations). Root-level entities, so its own executable.
[[lean_exe]]
name = "leanapi_counter_app"
root = "TestsNative.CounterApp"

# The Part 1 post's api without pages (`partiful_v2/Domain.lean`, staged unchanged but for its
# imports and module name by `scripts/stage_partiful_api.py`). Root-level entities, so its own
# executable. A library claims every module under its name, also in workspaces that require
# leanapi, so a test fixture never takes an app's namespace (an app's `Partiful.*` would
# otherwise have two providers): it is `LeanApiPartifulFixture.*`.
[[lean_lib]]
name = "LeanApiPartifulFixture"
srcDir = ".lake/leanapi-partiful-fixture"
globs = ["LeanApiPartifulFixture.+"]

[[lean_exe]]
name = "leanapi_partiful_api"
srcDir = ".lake/leanapi-partiful-fixture"
root = "LeanApiPartifulFixture.Server"

[[lean_lib]]
name = "Notes"
srcDir = "examples/notes"
globs = ["Notes.+"]

[[lean_exe]]
name = "notes"
srcDir = "examples/notes"
root = "NotesMain"

[[lean_lib]]
name = "PrivateGames"
srcDir = "examples/private-games"
globs = ["PrivateGames.+"]

[[lean_exe]]
name = "games"
srcDir = "examples/private-games"
root = "GamesMain"

# The core HTTP/runtime test modules. Named `LeanApiTests.*`, not `Tests.*`: a `Tests` library
# in a dependency (leanontology, LeanDB) would claim every `Tests.*` module.
[[lean_lib]]
name = "LeanApiTests"
srcDir = "tests"
globs = ["LeanApiTests.+"]

[[lean_exe]]
name = "leanapi_tests"
srcDir = "tests"
root = "Main"

# Prototype of DESIGN.md §7.5: row-level policies as a LeanDB view.
[[lean_lib]]
name = "PolicyView"
srcDir = "examples/policy-view"
globs = ["PolicyView.+"]

[[lean_exe]]
name = "policyview"
srcDir = "examples/policy-view"
root = "PolicyViewMain"

# Multi-tenant help desk: row-level policy with two kinds of actor.
[[lean_lib]]
name = "Helpdesk"
srcDir = "examples/helpdesk"
globs = ["Helpdesk.+"]

[[lean_exe]]
name = "helpdesk"
srcDir = "examples/helpdesk"
root = "HelpdeskMain"

[[lean_lib]]
name = "Billing"
srcDir = "examples/billing"
globs = ["Billing.+"]

[[lean_exe]]
name = "billing"
srcDir = "examples/billing"
root = "BillingMain"

# Calendly-style booking: no double-booking, free/busy is a projection.
[[lean_lib]]
name = "Scheduling"
srcDir = "examples/scheduling"
globs = ["Scheduling.+"]

[[lean_exe]]
name = "scheduling"
srcDir = "examples/scheduling"
root = "SchedulingMain"

# The schema-change demo (examples/teams-demo/README.md): change the schema,
# and the compiler points at the API.
[[lean_lib]]
name = "TeamsDemo"
srcDir = "examples/teams-demo"
globs = ["TeamsDemo.+"]

[[lean_exe]]
name = "teamsdemo"
srcDir = "examples/teams-demo"
root = "TeamsDemoMain"

# The starter examples in README.md.
[[lean_exe]]
name = "hello"
srcDir = "examples/starter"
root = "Hello"

[[lean_exe]]
name = "items"
srcDir = "examples/starter"
root = "Items"

[[lean_exe]]
name = "users"
srcDir = "examples/starter"
root = "Users"
