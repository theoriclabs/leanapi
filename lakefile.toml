name = "leanapi"
version = "0.6.0"
defaultTargets = ["LeanApi", "PolicyView", "Helpdesk", "Billing"]

# Crypto dependency (M2), pinned by tag.
[[require]]
name = "leancrypto"
git = "https://github.com/theoriclabs/leancrypto"
rev = "v0.1.0"

# Toolchain pinned to leanprover/lean4:v4.33.0 (see lean-toolchain), matching
# LeanDB 0.4.0, leanhttp and leanws. Bump in lockstep.

# Persistence (M4). Pinned by commit at LeanDB M14c (typed reads and
# transactions, LAPI-02…05); move to the tag once LeanDB releases M14.
[[require]]
name = "leandb"
git = "https://github.com/theoriclabs/LeanDB"
rev = "afe45445371ee5cfab7ee82900cc7b0ce58d2551"

[[lean_lib]]
name = "LeanApi"

[[lean_lib]]
name = "Notes"
srcDir = "examples/notes"
globs = ["Notes.+"]

[[lean_exe]]
name = "notes"
srcDir = "examples/notes"
root = "NotesMain"

[[lean_lib]]
name = "PrivateGames"
srcDir = "examples/private-games"
globs = ["PrivateGames.+"]

[[lean_exe]]
name = "games"
srcDir = "examples/private-games"
root = "GamesMain"

[[lean_lib]]
name = "Tests"
srcDir = "tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "leanapi_tests"
srcDir = "tests"
root = "Main"

# Prototype of DESIGN.md §7.5: row-level policies as a LeanDB view.
[[lean_lib]]
name = "PolicyView"
srcDir = "examples/policy-view"
globs = ["PolicyView.+"]

[[lean_exe]]
name = "policyview"
srcDir = "examples/policy-view"
root = "PolicyViewMain"

# Multi-tenant help desk: row-level policy with two kinds of actor.
[[lean_lib]]
name = "Helpdesk"
srcDir = "examples/helpdesk"
globs = ["Helpdesk.+"]

[[lean_exe]]
name = "helpdesk"
srcDir = "examples/helpdesk"
root = "HelpdeskMain"

[[lean_lib]]
name = "Billing"
srcDir = "examples/billing"
globs = ["Billing.+"]

[[lean_exe]]
name = "billing"
srcDir = "examples/billing"
root = "BillingMain"
