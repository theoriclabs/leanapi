name = "leanapi"
version = "0.6.0"
defaultTargets = ["LeanApi"]

# Crypto dependency (M2), pinned by tag.
[[require]]
name = "leancrypto"
git = "https://github.com/theoriclabs/leancrypto"
rev = "v0.1.0"

# Toolchain pinned to leanprover/lean4:v4.33.0 (see lean-toolchain), matching
# LeanDB 0.4.0, leanhttp and leanws. Bump in lockstep.

# Persistence (M4). Pinned by commit at the LeanDB M13 fixes (LAPI-01);
# move to the tag once LeanDB releases M13.
[[require]]
name = "leandb"
git = "https://github.com/theoriclabs/LeanDB"
rev = "64c768e6612b73fcc035725acc634b52c684bc0b"

[[lean_lib]]
name = "LeanApi"

[[lean_lib]]
name = "Notes"
srcDir = "examples/notes"
globs = ["Notes.+"]

[[lean_exe]]
name = "notes"
srcDir = "examples/notes"
root = "NotesMain"

[[lean_lib]]
name = "PrivateGames"
srcDir = "examples/private-games"
globs = ["PrivateGames.+"]

[[lean_exe]]
name = "games"
srcDir = "examples/private-games"
root = "GamesMain"

[[lean_lib]]
name = "Tests"
srcDir = "tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "leanapi_tests"
srcDir = "tests"
root = "Main"
