name = "leanapi"
version = "0.2.0"
defaultTargets = ["LeanApi"]

# Crypto dependency (M2). Sibling checkout; the published form is
#   git = "https://github.com/theoriclabs/leancrypto", rev = "v0.1.0"
[[require]]
name = "leancrypto"
path = "../leancrypto"

# Toolchain pinned to leanprover/lean4:v4.33.0 (see lean-toolchain), matching
# LeanDB 0.4.0, leanhttp and leanws. Bump in lockstep.

# Persistence (M4). Pinned by tag, matching the toolchain.
[[require]]
name = "leandb"
git = "https://github.com/theoriclabs/LeanDB"
rev = "v0.4.0"

[[lean_lib]]
name = "LeanApi"

[[lean_lib]]
name = "Notes"
srcDir = "examples/notes"
globs = ["Notes.+"]

[[lean_exe]]
name = "notes"
srcDir = "examples/notes"
root = "NotesMain"

[[lean_lib]]
name = "PrivateGames"
srcDir = "examples/private-games"
globs = ["PrivateGames.+"]

[[lean_lib]]
name = "Tests"
srcDir = "tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "leanapi_tests"
srcDir = "tests"
root = "Main"
