name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04, not latest: leancrypto links the system's static libcrypto, and the one
        # built for glibc 2.38+ (Ubuntu 24.04) calls `__isoc23_*` functions that Lean's bundled
        # glibc does not have.
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 || true
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
      - name: Build
        run: lake build
      - name: Tests
        run: lake build leanapi_tests && ./.lake/build/bin/leanapi_tests
      - name: Proof audit
        run: ./scripts/axiom_audit.sh
      - name: README examples compile and match examples/starter
        run: ./scripts/check_readme.sh
      - name: The starter examples answer as the README shows
        run: ./examples/starter/smoke.sh
      - name: EVIDENCE.md claim tables match the property registry
        run: ./scripts/gen_evidence.sh --check
      - name: Only authentication makes an Auth (no framework internals outside LeanApi/)
        run: ./scripts/check_private_escapes.sh
      - name: Example posts are checked against the code
        run: for p in helpdesk billing scheduling; do ./scripts/check_blog.sh --post docs/blog/$p.md; done
      - name: The schema-change demo (every step fails or answers as its README says)
        run: ./examples/teams-demo/demo.sh check
