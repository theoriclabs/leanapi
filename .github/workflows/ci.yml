name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # leancrypto is private: a token with read access lets lake clone it.
      - name: Private dependency access
        env:
          TOKEN: ${{ secrets.LEANCRYPTO_TOKEN }}
        if: env.TOKEN != ''
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 || true
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
      - name: Build
        run: lake build
      - name: Tests
        run: lake build leanapi_tests && ./.lake/build/bin/leanapi_tests
      - name: Proof audit
        run: ./scripts/axiom_audit.sh
      - name: README snippets compile
        run: ./scripts/check_readme.sh
